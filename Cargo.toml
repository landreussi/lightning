[workspace]
members = ["api", "mempool", "sync"]
resolver = "3"

[workspace.dependencies]
## Local crates
api = { path = "./api" }
mempool = { path = "./mempool" }

## Crates
async-trait = "0.1.89"
axum = "0.8.9"
diesel = { version = "2.3.13", default-features = false, features = ["postgres_backend", "numeric", "time"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"] }
dotenvy = "0.15.7"
envy = "0.4.2"
mockall = "0.15.0"
mockito = "1.7.2"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls"] }
rust_decimal = { version = "1.43.0", features = ["db-diesel2-postgres", "serde-with-str"] }
secp256k1 = { version = "0.33.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = { version = "0.3.44", features = ["serde", "formatting", "macros", "parsing"] }
tower = { version = "0.5.3", features = ["util"] }
tokio = { version = "1.51.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
